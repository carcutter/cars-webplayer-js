name: Continuous Integration
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "turbo.json"
      - "yarn.lock"
      - ".github/workflows/continuous_integration.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Lint
        run: yarn lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Build
        run: yarn build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Test
        run: yarn test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Install the Playwright browser
        run: yarn workspace e2e playwright install --with-deps chromium

      - name: E2E
        run: yarn e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report

  consumers:
    name: Consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Install the Playwright browser
        run: yarn workspace e2e playwright install --with-deps chromium

      - name: Packed packages in consumer apps
        run: yarn test:consumers
