name: Continuous Integration
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/**"
      - "consumers/**"
      - ".syncpackrc"
      - ".eslintrc.cjs"
      - ".github/actions/**"
      - ".github/workflows/continuous_integration.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Lint
        run: pnpm lint

      # Keeps the local packages linked (workspace:^), not installed from npm
      - name: Syncpack
        run: pnpm syncpack:lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Build
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Test
        run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Install the Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report

  consumers:
    name: Consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install_tools

      - name: Install the Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Packed packages in consumer apps
        run: pnpm test:consumers
