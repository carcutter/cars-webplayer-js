name: Lint Commit Messages
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  commits:
    name: Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo's commitlint and config (commitlint-github-action bundles its
      # own commitlint, and refuses a .js config)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: pnpm

      # The root package only, which has commitlint
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter .

      # --strict fails on warnings too
      - name: Lint the commits of the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE" --to "$HEAD" --strict --verbose
