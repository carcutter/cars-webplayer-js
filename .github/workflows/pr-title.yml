name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [develop, main]

# Cancel superseded runs on the same PR.
concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  lint:
    name: Validate conventional PR title
    runs-on: ubuntu-latest
    steps:
      # Since the squash-merge commit message is taken from the PR title,
      # enforce Conventional Commits on the title so merged history stays consistent.
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
