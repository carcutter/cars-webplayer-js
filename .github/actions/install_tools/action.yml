name: Install Tools
description: "Installs dependencies"
runs:
  using: composite
  steps:
    # Installs the pnpm version of the packageManager field
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "22.14"
        registry-url: "https://registry.npmjs.org"
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build
      shell: bash
      run: pnpm build

    - name: Lint
      shell: bash
      run: pnpm lint
