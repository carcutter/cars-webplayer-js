packages:
  - apps/*
  - packages/*

overrides:
  # The patched majors of minimatch (GHSA-g3hv-75wg-m249) and glob
  # (GHSA-3g3m-2fjr-6pw4), checked by the builds, lint and tests using them.
  # Not minimatch 3 (ESLint and its plugins): no 3.x fixes that advisory
  "minimatch@>=9 <11.0.1": ^11.0.1
  "glob@>=9 <14.0.2": ^14.0.2
  serialize-javascript: ^7.1.3
  sockjs>uuid: ^11.1.1
  tinypool: ^2.1.2

packageExtensions:
  # next's declarations import React's types without depending on them: they
  # resolved to whichever @types/react pnpm hoisted (it can be the React 17
  # demo's), instead of the one of the package using next
  next:
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  # Its postinstall only prints a funding banner
  - core-js
