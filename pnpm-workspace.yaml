packages:
  - apps/*
  - packages/*

overrides:
  "@microsoft/api-extractor": ~7.59.4
  "@typescript-eslint/typescript-estree>minimatch": ^9.0.7
  serialize-javascript: ^7.1.3
  sockjs>uuid: ^11.1.1
  tinypool: ^2.1.2
  # As with Yarn: r2wc v2 on @r2wc/core 1.3.0 (r2wc v1 is on 1.3.1). pnpm
  # import would have resolved both to 1.3.1, changing the published bundles
  "@r2wc/react-to-web-component@2.1.0>@r2wc/core": 1.3.0

patchedDependencies:
  "@r2wc/react-to-web-component@2.1.0": patches/@r2wc__react-to-web-component@2.1.0.patch

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  # Its postinstall only prints a funding banner
  - core-js
