packages:
  - apps/*
  - packages/*

# demo-angular gets a copy of angular-webplayer (injected in its package.json),
# instead of a link to its folder, which has its own Angular (the lowest
# version it supports): with the link, the demo would get two Angular cores.
# The copy is updated once the package is built
syncInjectedDepsAfterScripts:
  - build

# Keeps React's types out of the hidden hoisted folder: a package importing
# them without depending on them resolved to whichever version pnpm hoisted
# (it can be the React 17 demo's), instead of failing
hoistPattern:
  - "*"
  - "!@types/react"
  - "!@types/react-dom"

overrides:
  # The patched majors of minimatch (GHSA-g3hv-75wg-m249) and glob
  # (GHSA-3g3m-2fjr-6pw4), checked by the builds, lint and tests using them
  # (ESLint 10 included, which asks for minimatch 10). Not minimatch 3: no 3.x
  # fixes that advisory
  "minimatch@>=9 <11.0.1": ^11.0.1
  "glob@>=9 <14.0.2": ^14.0.2
  serialize-javascript: ^7.1.3
  sockjs>uuid: ^11.1.1
  tinypool: ^2.1.2
  # The patched versions of the tools pinned by @angular/build 19 (the lowest
  # Angular of angular-webplayer, whose 19.x gets no more fixes): piscina,
  # vite (and its launch-editor), esbuild, @babel/core
  "@angular/build@19>piscina": ^4.9.4
  "@angular/build@19>vite": ^6.4.4
  "@angular/build@19>esbuild": ^0.28.1
  "@angular/build@19>@babel/core": ^7.29.6
  "@angular/compiler-cli@19>@babel/core": ^7.29.6

packageExtensions:
  # next's declarations import React's types without depending on them: they
  # resolve to the ones of the package using next (React's types aren't
  # hoisted, see hoistPattern)
  next:
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true

  # It imports the Angular compiler and typescript without depending on them:
  # they resolved to the hoisted ones (Angular 21 of demo-angular, TypeScript
  # 6), instead of the ones of angular-webplayer (Angular 19 and TypeScript
  # 5.8, the lowest versions it supports)
  "@analogjs/vite-plugin-angular":
    peerDependencies:
      "@angular/compiler": "*"
      "@angular/compiler-cli": "*"
      typescript: "*"

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  # Its postinstall only prints a funding banner
  - core-js
  # Native helpers of the Angular CLI (file watcher, build cache), installed
  # as prebuilt binaries: their scripts only build them when there's none
  - "@parcel/watcher"
  - lmdb
  - msgpackr-extract
